<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Staf - SIM Klinik Pratama Sehat Mandiri</title>
  
  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Bootstrap 4.6 & AdminLTE -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/admin-lte@3.2/dist/css/adminlte.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: radial-gradient(circle at top left, #0f766e 0%, #064e3b 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .login-box-custom {
      width: 100%;
      max-width: 460px;
    }
    .card-login {
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.15);
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }
    .login-header {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      color: white;
      padding: 2.2rem 2rem 1.8rem;
      text-align: center;
    }
    .btn-login {
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      border: none;
      color: white;
      font-weight: 700;
      padding: 0.75rem;
      border-radius: 0.5rem;
      transition: all 0.2s;
    }
    .btn-login:hover {
      background: linear-gradient(135deg, #115e59, #0f766e);
      color: white;
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(15, 118, 110, 0.35);
    }
    .quick-role-badge {
      cursor: pointer;
      padding: 0.35rem 0.65rem;
      border-radius: 0.375rem;
      font-size: 0.8rem;
      font-weight: 600;
      transition: all 0.2s;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #334155;
    }
    .quick-role-badge:hover {
      background: #ccfbf1;
      border-color: #14b8a6;
      color: #0f766e;
    }
  </style>
</head>
<body>

  <div class="login-box-custom">
    <div class="card card-login">
      <div class="login-header">
        <div class="mb-2">
          <i class="fas fa-hospital-user fa-3x"></i>
        </div>
        <h3 class="font-weight-bold mb-1">SIM KLINIK</h3>
        <p class="mb-0 small text-light opacity-80">Sistem Informasi Manajemen Klinik Terpadu</p>
      </div>

      <div class="card-body p-4">
        <form id="formLogin">
          <div class="form-group mb-3">
            <label class="font-weight-bold small text-muted">USERNAME</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-user text-muted"></i></span>
              </div>
              <input type="text" id="username" class="form-control border-left-0" placeholder="Masukkan username" required autocomplete="username">
            </div>
          </div>

          <div class="form-group mb-4">
            <label class="font-weight-bold small text-muted">PASSWORD</label>
            <div class="input-group">
              <div class="input-group-prepend">
                <span class="input-group-text bg-white border-right-0"><i class="fas fa-lock text-muted"></i></span>
              </div>
              <input type="password" id="password" class="form-control border-left-0" placeholder="Masukkan password" required autocomplete="current-password">
            </div>
          </div>

          <button type="submit" class="btn btn-login btn-block mb-3" id="btnLogin">
            <i class="fas fa-sign-in-alt mr-2"></i> Masuk ke Sistem
          </button>
        </form>

        <!-- Quick Demo Accounts for Testing/QA -->
        <div class="mt-4 pt-3 border-top">
          <p class="text-muted small font-weight-bold mb-2 text-center">
            <i class="fas fa-bolt text-warning mr-1"></i> Quick Login (Klik untuk Isi Akun Demo):
          </p>
          <div class="d-flex flex-wrap justify-content-center gap-2">
            <span class="quick-role-badge m-1" onclick="setDemo('admin', 'password')">
              <i class="fas fa-user-shield text-danger mr-1"></i> Admin
            </span>
            <span class="quick-role-badge m-1" onclick="setDemo('dokter1', 'password')">
              <i class="fas fa-user-md text-primary mr-1"></i> Dokter
            </span>
            <span class="quick-role-badge m-1" onclick="setDemo('pendaftaran1', 'password')">
              <i class="fas fa-clipboard-list text-success mr-1"></i> Pendaftaran
            </span>
            <span class="quick-role-badge m-1" onclick="setDemo('kasir1', 'password')">
              <i class="fas fa-cash-register text-info mr-1"></i> Kasir
            </span>
            <span class="quick-role-badge m-1" onclick="setDemo('apoteker1', 'password')">
              <i class="fas fa-prescription-bottle-alt text-warning mr-1"></i> Apoteker
            </span>
          </div>
        </div>

        <div class="text-center mt-4">
          <a href="/" class="small text-muted font-weight-bold">
            <i class="fas fa-arrow-left mr-1"></i> Kembali ke Landing Page
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    function setDemo(username, password) {
      document.getElementById('username').value = username;
      document.getElementById('password').value = password;
    }

    document.getElementById('formLogin').addEventListener('submit', async function (e) {
      e.preventDefault();

      const btn = document.getElementById('btnLogin');
      const originalText = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Memvalidasi...';

      const payload = {
        username: document.getElementById('username').value.trim(),
        password: document.getElementById('password').value
      };

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success && result.data) {
          localStorage.setItem('simklinik_user', JSON.stringify(result.data));
          localStorage.setItem('simklinik_token', result.data.token);

          Swal.fire({
            icon: 'success',
            title: 'Login Berhasil!',
            text: `Selamat datang, ${result.data.nama_lengkap} (${result.data.role.toUpperCase()})`,
            showConfirmButton: false,
            timer: 1200
          }).then(() => {
            window.location.href = '/admin/index.html';
          });
        } else {
          Swal.fire({
            icon: 'error',
            title: 'Login Gagal',
            text: result.message || 'Username atau password tidak sesuai.'
          });
        }
      } catch (err) {
        console.error(err);
        Swal.fire('Error', 'Gagal menghubungi server.', 'error');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalText;
      }
    });

    // Check if already logged in
    const existing = localStorage.getItem('simklinik_user');
    if (existing) {
      // Allow fast jump to admin
      // window.location.href = '/admin/index.html';
    }
  </script>
</body>
</html>
